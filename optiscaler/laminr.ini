; -------------------------------------------------------
[Upscalers]
; -------------------------------------------------------
; Select Upscaler for Dx12 games
; dlss - Default (auto) is dlss
Dx12Upscaler=auto



; -------------------------------------------------------
[Inputs]
; -------------------------------------------------------
; OptiScaler will hook (nvngx.dll) and use Dlss Inputs
; true or false - Default (auto) is true
EnableDlssInputs=auto



; -------------------------------------------------------
[Framerate]
; -------------------------------------------------------
; Frame rate limit that uses Reflex whenever possible
; With NVIDIA FG, this limits total output FPS including generated frames.
; Higher fixed FG multipliers can lower rendered FPS to fit this cap. Use 0 to disable it.
; float - Default (auto) is 0.0 (disabled)
FramerateLimit=auto



; -------------------------------------------------------
[FSR]
; -------------------------------------------------------
; Camera vertical FOV. Read for compatibility; no current feature uses it
; 0.0 to 180.0 - Default (auto) is 60.0
VerticalFov=auto

; Camera near value for depth-aware sharpening (Sharpness Shader=da or lcda)
; Used when the game does not pass its own
; 0.0 to max float value - Default (auto) is 0.1
CameraNear=auto

; Camera far value for depth-aware sharpening (Sharpness Shader=da or lcda)
; Used when the game does not pass its own
; 0.0 to max float value - Default (auto) is 100000.0
CameraFar=auto



; -------------------------------------------------------
[DLSS]
; -------------------------------------------------------
; Enables calls to original NVNGX
; true or false - Default (auto) is true
Enabled=auto

; Set this to true to enable custom render preset overrides
; true or false - Default (auto) is false
RenderPresetOverride=auto

; Render presets for quality settings
; Depends on DLSS version, but most recent order is
; 0 = Default | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E | 6 = F | 7 = G 
; 8 = H | 9 = I | 10 = J | 11 = K | 12 = L | 13 = M | 14 = N | 15 = O 
; 0 to 16 are accepted, or 0x00FFFFFF for the latest preset the dll supports
; Default (auto) is 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto

; Use generic appid with NGX, fixes OptiScaler preset override not working with certain games
; true or false - Default (auto) is false
UseGenericAppIdWithDlss=auto



; -------------------------------------------------------
[DLSSD]
; -------------------------------------------------------
; Set this to true to enable custom render preset overrides
; true or false - Default (auto) is false
RenderPresetOverride=auto

; Render presets for quality settings
; Depends on DLSSD version, but most recent order is
; 0 = Default | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E | 6 = F
; 0x00FFFFFF selects the latest preset the dll supports
; Default (auto) is 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto



; -------------------------------------------------------
[Libraries]
; -------------------------------------------------------
; Main folder for OptiScaler to check dll files below
; Default is .\OptiScaler
OptiDllPath=auto

; Options below for overriding path per dll
; -----------------------------------------

; nvngx.dll or _nvngx.dll
NvngxPath=auto

; nvngx_dlss.dll
NvngxDlssPath=auto

; This path will be added to paths of Nvngx during init
NvngxFeaturePath=auto



; -------------------------------------------------------
[Menu]
; -------------------------------------------------------
; Enables new Overlay ImGui menus
; true or false - Default (auto) is true
OverlayMenu=auto

; In-game ImGui menu scale
; 0.5 to 2.0 - Default (auto) is 1.0, gets lower below 900p
Scale=auto

; Shortcut key for opening menu
; For all keycode values, you can check this address
; Match Description with key Value
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x2D which equals VK_INSERT/Insert key, previous default key was 0x24 -> VK_HOME/Home key
; If you want to use e.g. VK_BACK/Backspace key, that would be 0x08 - set ShortcutKey=0x08
; -1 -> No shortcut key
ShortcutKey=auto

; Extends Scaling Ratio limits to 0.1 - 6.0
; true or false - Default (auto) is false
ExtendedLimits=auto

; Use High Quality Font for Menu
; Might use more VRAM
; true or false - Default (auto) is true
UseHQFont=auto

; Controls the size of just the font without touching other style elements
; Mostly useful when using custom fonts via TTFFontPath
; float - Default (auto) is 14.0
FontSize=auto

; Path to a font to be used as HQ Font, requires UseHQFont=true
; Best to use monospace fonts
; Example path: C:\\Windows\\Fonts\\comic.ttf
; Default (auto) is Hack-Regular bundled with OptiScaler
TTFFontPath=auto

; Enables FPS overlay
; true or false - Default (auto) is false
ShowFps=auto

; In-game FPS Overlay scale
; 0.5 to 2.0 - Default (auto) is using the same scale as menu
FpsScale=auto

; FPS overlay position
; 0 = Top Left | 1 = Top Right | 2 = Bottom Left | 3 Bottom Right
; 0 to 3 - Default (auto) is 0
FpsOverlayPos=auto

; FPS overlay type
; 0 = Just FPS | 1 = Simple | 2 = Detailed | 3 = Detailed + Graph | 4 Full | 5 Full + Graph | 6 Reflex timings
; 0 to 6 - Default (auto) is 0
FpsOverlayType=auto

; Shortcut key for FPS overlay
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x21 -> VK_PRIOR/Page up key
; -1 -> No shortcut key
FpsShortcutKey=auto

; Shortcut key for FPS overlay type cycle
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x22 -> VK_NEXT/Page down key 
; -1 -> No shortcut key
FpsCycleShortcutKey=auto

; Enables Horizontal FPS overlay layout
; true or false - Default (auto) is false
FpsOverlayHorizontal=auto

; FPS Overlay background alpha
; 0.0 to 1.0 - Default (auto) is 0.4
FpsOverlayAlpha=auto

; Overlays uses the theme colors
; true or false - Default (auto) is false
OverlaysUseTheme=auto

; Enables Light Theme for Menu  
; true or false - Default (auto) is false
LightTheme=auto

; Accent color for the menu
; R/G/B float colors values of the accent color for the menu
; 0.0 to 1.0 - Default (auto) R: 0.62, G: 0.32, B: 1.0 (Purple)
AccentColorR=auto
AccentColorG=auto
AccentColorB=auto

; Background color for the menu
; R/G/B float colors values of the accent color for the menu
; 0.0 to 1.0 - Default (auto) R: 0.0, G: 0.0, B: 0.0 (Black)
BGColorR=auto
BGColorG=auto
BGColorB=auto

; Background alpha for the menu
; 0 is transparent and 1 is opaque
; 0.0 to 1.0 - Default (auto) 0.99
BGColorA=auto



; -------------------------------------------------------
[Plugins]
; -------------------------------------------------------
; Path that will be searched for same filename plugins (dxgi.dll, winmm.dll, etc.)
; Default is plugins under OptiDllPath ".\OptiScaler\plugins\"
Path=auto

; Lets OptiScaler load *.asi files in plugins folder
; true or false - Default (auto) is false
LoadAsiPlugins=auto

; Delay before injecting late-loaded *.asi files in plugins folder
; To load an ASI plugin late, add -loadlate to its filename before the extension, e.g. "myplugin-loadlate.asi"
; Integer value in seconds - Default (auto) is 30
LateAsiPluginsDelay=auto

; Loads SpecialK64.dll from game's exe folder
; Please create an empty SpecialK.dxgi file next to SpecialK64.dll
; to set SpecialK's working mode, otherwise it will not be activated
; true or false - Default (auto) is false
LoadSpecialK=auto

; Loads Reshade64.dll from game's exe folder
; Rename Reshade dll to ReShade64.dll, put next to OptiScaler and set to true
; true or false - Default (auto) is false
LoadReshade=auto



; -------------------------------------------------------
[NvApi]
; -------------------------------------------------------
; Disable FlipMetering
; Hides NVIDIA's flip metering control (NvAPI_D3D12_SetFlipConfig) from the game
; true or false - Default (auto) is false
DisableFlipMetering=auto



; -------------------------------------------------------
[Hooks]
; -------------------------------------------------------
; Early hooking of kernel methods 
; May cause compatibility issues!!!
; true or false - Default (auto) is false
EarlyHooking=auto

; Skip hooking of local nvngx files and only hook nvngx at registry
; true or false - Default (auto) is false
HookOriginalNvngxOnly=auto

; Only hook ntdll.dll methods, skip kernel32.dll and kernelbase.dll hooks
; true or false - Default (auto) is true
UseNtdllHooks=auto



; -------------------------------------------------------
[Sharpness]
; -------------------------------------------------------
; Options are:
; RCAS - AMD's Robust Contrast-Adaptive Sharpening
; DA - Enables Depth-based edge detection for sharpening.
;      Reduces sharpening across object boundaries to prevent halos and artifacts.
;      The farther away is the object, the more sharpening is applied (limited to 1.0)
;      Recommended for scenes with complex geometry or upscaling.
; LCDA - Local contrast version of the above DA
; rcas, da or lcda - Default (auto) is rcas
Shader=auto

; Override DLSS Sharpness parameter with fixed Sharpness value
; true or false - Default (auto) is false
OverrideSharpness=auto

; Strength of Sharpening, 
; value range between 0.0 and 1.0 (while using upper limit is RCAS 1.3) - Default (auto) is 0.4
Sharpness=auto



; -------------------------------------------------------
[OutputScaling]
; -------------------------------------------------------
; Enable Output Scaling
; true or false - Default (auto) is false
Enabled=auto

; Output Scaling ratio 
; 0.5 - 3.0 - Default (auto) is 1.5
Multiplier=auto

; Downscaler to use for Output Scaling
; 0 = FSR1 | 1 = Bicubic | 2 = Catmull-Rom | 3 = Lanczos2 | 4 = Lanczos3 | 5 = Kaiser2 | 6 = Kaiser3 | 7 = MAGIC
; 0 to 7 - Default (auto) is 0 (FSR1)
Downscaler=auto



; -------------------------------------------------------
[CAS]
; -------------------------------------------------------
; Enables RCAS sharpening 
; true or false - Default (auto) is false
Enabled=auto

; Enable Motion Sharpness
; true or false - Default (auto) is false
MotionSharpnessEnabled=auto

; Sharpening will be added or removed according to motion length
; value range between -1.3 and 1.3 - Default (auto) is 0.2
MotionSharpness=auto

; How much a pixel should move before Motion Sharpness is applied
; 0.0 - 100.0 - Default (auto) is 0.0
MotionThreshold=auto

; How much a pixel should move to reach maximum MotionSharpness value 
; Values between MotionThreshold and this value will use be used to scale sharpness value
; 0.0 - 100.0 - Default (auto) is 10.0
MotionScaleLimit=auto

; Enable Contrast based sharpening 
; Increases sharpness at high contrast areas.
; true or false - Default (auto) is false
ContrastEnabled=auto

; Contrast based sharpening value
; Higher values increases sharpness at high contrast areas.
; High values might cause graphical GLITCHES when used with high sharpness values !!!
; -2.0 - 2.0  - Default (auto) is -0.3
Contrast=auto

; Enable Debug Highlighting for Motion/DA Sharpening
; Reddish hue for added, greenish for reduced sharpness
; Blue tint for detected edges in Depth Aware sharpening
; true or false - Default (auto) is false
SharpenerDebug=auto

; Controls how strongly sharpening is reduced across depth edges.
; Higher values more aggressively block sharpening at object boundaries (reduces halos).
; Lower values allow more sharpening across edges (sharper, but riskier).
; float - Default (auto) is 35.0, or 250.0 when the depth buffer is linear
DADepthScale=auto

; Ignores small depth differences before edge detection.
; Higher values reduce noise and flickering from minor depth changes.
; Lower values preserve fine detail, but may react to depth noise.
; float - Default (auto) is 0.001, or 0.0015 when the depth buffer is linear
DADepthBias=auto

; Clamps the final image to the [0, 1] range.
; Prevents overshoot artifacts such as bright halos or negative colors.
; Recommended for LDR pipelines; optional for HDR depending on tone-mapping.
; true or false - Default (auto) follows the upscaler's HDR flag: clamped for SDR input, not for HDR
DAClampOutput=auto



; -------------------------------------------------------
[Magnifier]
; -------------------------------------------------------
; Enables magnifier
; By default, only visible when menu is visible and follows the cursor 
; true or false - Default (auto) is false
Enabled=auto

; Radius of the magnifier at % of screen height
; float - Default (auto) is 15.0
Size=auto

; The zoom factor of the magnifier
; 2 - 20 - Default (auto) is 4
ZoomFactor=auto

; Black border width of the magnifier, as % of screen height
; 0.0 - 2.0 - Default (auto) is 0.3
BorderSize=auto

; Position offset of the magnifier in relation to the mouse position, in pixels
; -1000 - 1000 - Default (auto) is 0
CursorOffsetX=auto
CursorOffsetY=auto

; Static position of the magnifier, as % of screen
; Having both values set will switch the magnifier to a static mode
; In static mode, the magnifier is always visible, even when the menu is not
; 0 - 100 - Default (auto) is none
StaticPosX=auto
StaticPosY=auto



; -------------------------------------------------------
[Log]
; -------------------------------------------------------
; Should a log file be created
; true or false - Default (auto) is false
LogToFile=auto

; Verbosity level of file logs
; 0 = Trace / 1 = Debug / 2 = Info / 3 = Warning / 4 = Error
; Default (auto) is 0 = Trace
LogLevel=auto

; Log to console (Log level is always 2 (Info) for performance reasons) 
; true or false - Default (auto) is false
LogToConsole=auto

; Log to NVNGX API
; true or false - Default (auto) is false
LogToNGX=auto

; Log to Debug output
; true or false - Default (auto) is false
LogToDebug=auto

; Open console window for logs
; true or false - Default (auto) is false
OpenConsole=auto

; When set to false creates a new log file for every OptiScaler session
; true or false - Default (auto) is true
SingleFile=auto

; Custom log filename
; You can also specify a custom *path* for the log
; Default (auto) is OptiScaler.log in current folder
LogFileName=auto

; Enables Async logging
; true or false - Default (auto) is false
LogAsync=auto

; Async logging threads 
; 1 - 8 - Default (auto) is 4
LogAsyncThreads=auto



; -------------------------------------------------------
[InitFlags]
; -------------------------------------------------------
; Force add ENABLE_AUTOEXPOSURE to init flags
; true or false - Default (auto) is  DLSS value
AutoExposure=auto

; Force add HDR_INPUT_COLOR to init flags
; true or false - Default (auto) is  DLSS value
HDR=auto

; Force add INVERTED_DEPTH to init flags
; true or false - Default (auto) is DLSS value
DepthInverted=auto

; Force add JITTERED_MV flag to init flags
; true or false - Default (auto) is  DLSS value
JitterCancellation=auto

; Force add HIGH_RES_MV flag to init flags
; true or false - Default (auto) is  DLSS value
DisplayResolution=auto



; -------------------------------------------------------
[UpscaleRatio]
; -------------------------------------------------------
; Set this to true to enable the internal Resolution Override 
; true or false - Default (auto) is false
UpscaleRatioOverrideEnabled=auto

; Set the forced Upscale Ratio value
; Default (auto) is 1.3
UpscaleRatioOverrideValue=auto



; -------------------------------------------------------
[QualityOverrides]
; -------------------------------------------------------
; Set this to true to enable Custom quality mode overrides
; true or false - Default (auto) is false
QualityRatioOverrideEnabled=auto

; Set Custom Upscaling Ratio for each quality mode
;
; Default (auto) values:
; DLAA					: 1.0
; Ultra Quality         : 1.3
; Quality               : 1.5
; Balanced              : 1.7
; Performance           : 2.0
; Ultra Performance     : 3.0
QualityRatioDLAA=auto
QualityRatioUltraQuality=auto
QualityRatioQuality=auto
QualityRatioBalanced=auto
QualityRatioPerformance=auto
QualityRatioUltraPerformance=auto



; -------------------------------------------------------
[DRS]
; -------------------------------------------------------
; Set this to true to enable limiting DRS min resolution to Rendering resolution
; true or false - Default (auto) is false
DrsMinOverrideEnabled=auto

; Set this to true to enable limiting DRS max resolution to Rendering resolution
; true or false - Default (auto) is false
DrsMaxOverrideEnabled=auto



; -------------------------------------------------------
[HDR]
; -------------------------------------------------------
; Force HDR color space
; true or false - Default (auto) is false
ForceHDR=auto

; Use HDR10
; DXGI_FORMAT_R10G10B10A2_UNORM instead of DXGI_FORMAT_R16G16B16A16_FLOAT
; true or false - Default (auto) is false
UseHDR10=auto

; Skip setting HDR colorspace 
; true or false - Default (auto) is false
SkipColorSpace=auto



; -------------------------------------------------------
[V-Sync]
; -------------------------------------------------------
; Enable V-Sync controls
; true or false - Default (auto) is false
OverrideVsync=auto

; Force V-Sync value
; true or false - Default (auto) is none selected
ForceVsync=auto

; Sync interval value for V-Sync
; 0 to 3 - Default (auto) is none selected
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; Override max Anisotropy/Anisotropic Filtering for textures
; 2, 4, 8, 16 - Default (auto) is disabled
AnisotropyOverride=auto

; Change comparison filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyComparison=auto

; Change min/max filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyMinMax=auto

; Skip overriding on point filters
; true or false - Default (auto) is true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; Override value for Mipmap LOD bias
; -15.0 - 15.0 - Default (auto) is disabled
MipmapBiasOverride=auto

; Use a fixed value for LOD bias 
; true or false - Default (auto) is false
MipmapBiasFixedOverride=auto

; Use override value as scale multiplier 
; true or false - Default (auto) is false
MipmapBiasScaleOverride=auto

; Override all textures LOD bias (normally only overriding < 0 values)
; true or false - Default (auto) is false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; Only inject into this specific process (case-insensitive)
; Example: TargetProcessName=FlightSimulator2024.exe
; Default (auto) is disabled (injects into all processes)
TargetProcessName=auto

; Don't inject into this specific process (case-insensitive)
; Process names seperated with pipe "|" - Default (auto) is 
; crashpad_handler.exe and others - listed in Config.h under ProcessFilter
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; Enables checking for latest version from Github
; true or false - Default (auto) is true
CheckForUpdate=auto

; Enables blocking of Steam and Epic overlays
; Also blocks Steam Input
; true or false - Default (auto) is false
DisableOverlays=auto

; OptiScaler will try to force High Performance GPU
; true or false - Default (auto) is true
PreferDedicatedGpu=auto

; OptiScaler will report only first High Performance GPU
; true or false - Default (auto) is false
PreferFirstDedicatedGpu=auto

; Rounds internal resolutions width and height to multiple of this value
; 2, 4, 8, 16 ...  - Default (auto) is disabled
RoundInternalResolution=auto

; Skips upscaling of n frames
; n is integer number  - Default (auto) is disabled
SkipFirstFrames=auto

; Restore last used compute signature after upscaling
; true or false - Default (auto) is false
RestoreComputeSignature=auto

; Restore last used graphics signature after upscaling
; true or false - Default (auto) is false
RestoreGraphicSignature=auto

; Tries to track signature changes to fully restore them
; Useful for games using bindless
; true or false - Default (auto) is false
ExtendedStateRestore=auto

; Use precompiled shaders for RCAS, Output Scaling and Mask Bias
; true or false - Default (auto) is true
UsePrecompiledShaders=auto

; Resource state correction for the textures passed to the upscaler
ColorResourceBarrier=auto
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; Default (auto) is state correction disabled
; These settings defines each resources initial resource 
; state and add resource barrier for correct state
;
; Common resource barrier states
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; All state values can be checked from here
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states

[DlssNr]
; 0 = NVIDIA (FP8, default), 4 = Experimental (FP8+NVFP4 hybrid).
; VERY minor improvements on Blackwell.
Precision=0
; Optional colour-based final-edit filter (not NVIDIA's semantic AutoMask).
; Warm scenery may match; coloured lighting may hide skin. Preview before relying on it.
; Controls apply once to the combined output of all model passes. 0..1 attenuates the edit.
SkinProtection=false
SkinToneEnabled=true
SkinDetail=1.0
SkinColour=1.0
EnvironmentDetail=1.0
EnvironmentColour=1.0
ShowSkinMask=false
; Virtual-key code for a key that toggles the pass in game. Unbound by default; set it from the
; Keybinds section of the overlay rather than by hand.
; Default (auto) is unbound
ToggleKey=auto
; DLSS 5 Neural Rendering. Synthesises detail in the upscaler's output, before frame generation sees it.
;
; Needs NVIDIA's nvngx_dlssnr.dll 310.8 placed beside OptiScaler or the game executable, plus
; nvngx.dll_dlssnr.dll. The snippet refuses callers whose module path does not contain
; "nvngx.dll", which is the only reason that second file exists.
;
; Undocumented and driven directly, so none of it is officially supported.
; Neural rendering always starts off: this key is not read at startup, and saving writes false.
; Turn it on with Enable Neural Rendering in the in-game menu, or with ToggleKey.
Enabled=auto

; Checked/true: run NR before ordinary SR or combined RR+SR on the active colour input.
; Unchecked/false: run NR after either upscaler. Both use WorkingScale and Passes below.
; Before RR, NR processes noisy ray-traced colour; visual results need testing.
; Origin-zero padded inputs use their active size. Invalid/offset colour falls back after upscaling.
; true or false - Default (auto) is false
RunBeforeSR=auto

; Apply NR after the game finishes its lighting and effects. Works with or without FG.
; Native DirectX 12 only. May also affect the HUD.
; With RunBeforeSR=true, generate NR before SR and apply its upscaled changes to the finished picture.
; This colour transfer is approximate and uses private DLSS SR. No RR in this combination.
FinishedPicture=false

; Experimental: generate NR before SR, use a separate DLSS SR feature to upscale its
; signed colour contribution, then apply after SR. Overrides RunBeforeSR, not RR.
; Requires a working NVIDIA DLSS SR runtime. Failure leaves the clean upscaled frame.
DeferredDLSS=auto
; Experimental: with RunBeforeSR and the game's Ray Reconstruction both on, run NR before SR
; but leave the colour input untouched, then add the model's edit back onto the RR+SR output
; so it survives RR's denoise. The edit is carried as an MV-reprojected temporal accumulator.
; Inert unless RunBeforeSR and RR are both active. true or false - Default (auto) is false
ResidualAcrossRR=auto
; History blend rate for ResidualAcrossRR's accumulator, 0.01 to 1.
; Lower = stabler but slower to appear; 1.0 = no accumulation (raw per-frame residual, flickers).
; Default (auto) is 0.08
ResidualAcrossRRBlend=auto
; Experimental every-other-frame NR with NVIDIA FG on the residual layer.
; Delays SR colour one frame; downstream game effects may use newer-frame guides.
ResidualFG=auto
; Explicit consent to approximate camera transforms when full camera guides are absent.
ResidualFGApproxCamera=auto

; SR and RR+SR share RunBeforeSR, WorkingScale and Passes.
; Legacy ApplyAfterRR, RRPasses and RRWorkingScale keys are ignored.

; Number of sequential model layers between one encode and one final composition. Each extra layer
; consumes the preceding model output and owns a separate persistent feature/history. 1 is normal;
; 2 and 3 are deliberately over-processed and cost almost exactly 2x and 3x the model time. The final
; answer is composed once against the immutable base proxy, so colour and transfer do not compound.
; Values are clamped to 1..3.
; Default (auto) is 1
Passes=auto
; Optional extended range up to 30 passes. Normal ceiling remains 3; no extra work while off.
; Additional per-pass keys: Pass4Style/Intensity/LocalStructure/LocalTone/SkinStructure/AutoMask, etc.
; Omitted controls inherit pass 1, except later-pass local tone defaults to 0.
UnlockPasses=false

; How far the frame moves toward the model's picture. Its answer is not added to the frame: it is a
; complete picture, rescaled so its luminance sits where the original says it should, and this blends
; between the two. 0 gives back exactly what the upscaler produced, 1 is the model's picture, and above
; 1 carries on past it.
; Default (auto) is 1.0
TransferStrength=auto

; Whether the model's colour arrives with its light. 0 keeps the game's own hue exactly and lets only
; brightness carry the model's verdict; 1 brings the model's colour as well, in its own hue.
; Default (auto) is 1.0
ColourStrength=auto

; The linear value the encode maps to display white, which belongs to the game's exposure rather than to
; any fixed number: measured frame means in one game ranged from 0.065 to 185. Left automatic, it is
; measured from the frame. This does move the result, not only what the model is shown: the picture the
; model was given is one of the luminances the composition weighs. Applies only to a linear buffer; a
; frame the game reports as already tone-mapped is passed over untouched.
; Multiplies the white point above before the model sees the frame -- the paper-white control.
; Default (auto) is 1.0
WhitePointScale=auto

; The most the pass may brighten any pixel, as a multiple of what it already was. Darkening is not
; capped. Guards against the model turning a bright light into a string of coloured cells.
; Default (auto) is 2.0
MaxRatio=auto

; What fraction of the frame the model works at. The frame itself is never reduced -- only the model's
; own work is done small and enlarged. Cost falls with the square of this. Above 1.0
; the model supersamples: it runs above native and the answer is averaged back down.
; Default (auto) is 1.0
WorkingScale=auto

; The downscaler that averages the model's answer back to native when WorkingScale is above 1.0
; (supersampling). Independent of OutputScaling/Downscaler, so the two can differ. 0 FSR1, 1 Bicubic,
; 2 CatmullRom, 3 Lanczos2, 4 Lanczos3, 5 Kaiser2, 6 Kaiser3, 7 MAGIC.
; Default (auto) is 4 (Lanczos3)
ScalingDownscaler=auto

; 0 off, 1 the picture the model sees, 2 its raw answer, 3 what it changed amplified twenty times.
; A flat grey difference view means the model is doing nothing.
; Default (auto) is 0
DebugView=auto

; Writes matched before/after frames to a dlssnr-capture folder beside OptiScaler when the pass first
; runs. Bounded to eight frames, and each run overwrites the last.
; true or false - Default (auto) is true
AutoCapture=auto

; Model controls. Preset and Style are baked into each feature, so changing them causes a guarded
; feature rebuild after the current GPU work retires. The values are undocumented, and the preset
; scale is not the same one Super Resolution or Ray Reconstruction uses.
; Default (auto) is 0
Preset=auto
Style=auto

; Passes 2 and 3 inherit the pass 1 Preset/Style above when left on auto. Set an override to use a
; different built-in model profile for that layer: preset 0..3; style 0 standard, 1 natural,
; 2 cinematic. These select profiles inside the same NVIDIA model DLL, not different model files.
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; Per-pass model strengths (shared by SR and RR+SR).
; Auto inherits pass 1, except LocalTone: auto keeps the legacy later-pass value 0.
; Intensity/LocalStructure/LocalTone: 0..2; SkinStructure: -1..2 (-1 follows structure).
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; Default (auto) is 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 means follow local structure, which is the model's own default, not a strength of zero.
; Default (auto) is -1.0
SkinStructure=auto
; true or false - Default (auto) is true
AutoMask=auto
